[package]
name = "lancat-slint"
version = "0.2.4"
edition = "2021"
authors = ["Motto"]
license = "GPL-3.0-only"
description = "Lancat 面板的 Slint 版（直接调用 lancat-core，软件渲染）"

# 独立 workspace：不改根 Cargo.toml / Cargo.lock，不影响 tauri dev。
[workspace]

[dependencies]
lancat-core = { path = "../lancat-core", default-features = false }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
# IME 预编辑 / 输入法候选框位置走 Slint 内部 API（WindowAdapterInternal / InternalKeyEvent），必须钉死版本
i-slint-core = "=1.18.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
dirs = "7"
# Lottie 表情：ThorVG（源码编译，CPU 光栅；bindgen 需要 libclang，Windows 在 C:\Program Files\LLVM）
thorvg-sys = { version = "=0.3.2", default-features = false, features = ["vendored", "lottie"] }
flate2 = "1"
# 一键更新：校验下载的新版（发布里的 SHA256SUMS）
sha2 = { version = "0.10", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
# 阶段 3 之前 Linux 先用 winit 后端跑通界面；之后换成自写 SCTK layer-shell Platform
slint = { version = "=1.18.1", default-features = false, features = ["backend-winit", "renderer-winit-software"] }
# 自写 Wayland 后端（wlr-layer-shell + wl_shm + text-input-v3），API 按 SCTK 0.21.1 源码核实
# 键盘用 xkbcommon（系统 libxkbcommon，含 compose）；不要 calloop（事件循环是自己写的 poll）
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["xkbcommon"] }
wayland-client = "0.31"
# zwp_text_input_v3（输入法）在 unstable 里
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
# 表情面板静止格的系统彩色字形（Slint 已经依赖 swash，这里只多开 render）
# 托盘：StatusNotifierItem（旧版 tauri 托盘在 Linux 上走 libappindicator → SNI）
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
swash = { version = "0.2.10", default-features = false, features = ["std", "scale", "render"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_ProcessStatus", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_WindowsFirewall", "Win32_Networking_NetworkListManager", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Media_Audio"] }
# D2D 点坐标类型（toast 绘制，与 src-tauri 相同）
windows-numerics = "0.2"

[build-dependencies]
slint-build = "=1.18.1"
flate2 = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.fastrel]
inherits = "release"
lto = false
codegen-units = 16
opt-level = "s"
# 只重编改动的部分：改一行代码后重编从约 100 s 降到约 10 s（Windows 实测）
incremental = true
