[workspace]
resolver = "2"
members = ["crates/lancat-core", "src-tauri"]

[workspace.package]
version = "0.2.2"
edition = "2021"
authors = ["Motto"]
license = "GPL-3.0-only"

[profile.release]
# size first (installer < 15 MB, binary <= 8 MB, see docs/postmortem-memory.md): "z" + fat LTO +
# one codegen unit; the hot paths that need speed get opt-level 3 below.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# file hashing must keep up with gigabit transfers
[profile.release.package.blake3]
opt-level = 3

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

# quick optimised builds for measuring on slow machines (release minus fat LTO); not for shipping
[profile.fastrel]
inherits = "release"
lto = false
codegen-units = 16
opt-level = "s"
# 只重编改动的部分：改一行代码后重编从约 100 s 降到约 10 s（Windows 实测）
incremental = true
