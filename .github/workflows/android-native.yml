# 原生安卓版（android-native/：Kotlin + Jetpack Compose，Rust 核心经 UniFFI）。
# - android 分支推送 / 手动运行：编译 + 单元测试，APK 上传为 Actions artifact，不发布。
# - 推送版本标签 v*（例如 v0.2.9、v0.2.8-android.2）：按标签注入版本号编译，把签名的 APK 和校验值
#   （Lancat-android.apk、Lancat-android.apk.sha256）附加到同名 GitHub Release，供 App 内「检查更新」下载。
#   Release 通常由桌面版 release.yml 创建，这里等它出现后追加文件；等不到就自己创建。
#   注意：只有标签所指的提交里包含本文件（及 android-native/）时这个工作流才会运行。
name: android-native

on:
  push:
    tags: ["v*"]
    branches: [android]
    paths:
      - "android-native/**"
      - "crates/lancat-core/**"
      - "crates/lancat-ffi/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "27.2.12479018"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"   # 默认的 "tools" 包已从仓库下架，会让这一步失败

      - name: Android SDK / NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lancat-ffi

      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Rust core (liblancat_ffi.so)
        working-directory: crates/lancat-ffi
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 -o ../../android-native/core/src/main/jniLibs build --release --lib

      - name: FFI smoke test (host, loopback only)
        working-directory: crates/lancat-ffi
        run: |
          cargo build --manifest-path ../lancat-core/Cargo.toml --bin lancat-cli
          LANCAT_CLI="$(cd ../.. && pwd)/target/debug/lancat-cli" cargo test --test smoke_cli -- --nocapture

      - name: 版本号（标签 v1.2.3 / v1.2.3-android.N → versionName，versionCode 由 app/build.gradle.kts 按同一公式算）
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ "$v" =~ ^[0-9]+(\.[0-9]+){0,2}(-android\.?[0-9]+)?$ ]]; then
            echo "LANCAT_VERSION=$v" >> "$GITHUB_ENV"
            echo "LANCAT_PUBLISH=1" >> "$GITHUB_ENV"
          else
            echo "标签 $GITHUB_REF_NAME 不是正式版本号（预发布等），只编译不发布"
          fi

      - name: Gradle (unit tests + release APK)
        working-directory: android-native
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --console=plain --no-daemon :model:test :sticker:testDebugUnitTest :app:testDebugUnitTest :app:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Lancat-android-native
          path: android-native/app/build/outputs/apk/release/*.apk

      - name: 发布到 GitHub Release（Lancat-android.apk + .sha256）
        if: github.ref_type == 'tag' && env.LANCAT_PUBLISH == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-native/app/build/outputs/apk/release/app-release.apk dist/Lancat-android.apk
          (cd dist && sha256sum Lancat-android.apk > Lancat-android.apk.sha256 && cat Lancat-android.apk.sha256)
          tag="$GITHUB_REF_NAME"
          # 桌面版 release.yml 编译完会创建 Release（带自动生成的更新说明）；最多等 45 分钟
          for i in $(seq 1 90); do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break
            [[ $i == 90 ]] && gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$tag"
            sleep 30
          done
          gh release upload "$tag" dist/Lancat-android.apk dist/Lancat-android.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
