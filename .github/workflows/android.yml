# Android 版：cargo-ndk 编 liblancat.so（crates/lancat-android，库根是桌面版的 src/main.rs），
# 再用 Gradle（android/，NativeActivity 外壳）打 APK，自签名后作为构建产物上传。不发布 Release。
name: android

on:
  workflow_dispatch:
  push:
    branches: [android]

env:
  CARGO_TERM_COLOR: always
  # thorvg（C++）和 Skia 都静态链接 libc++，APK 里不用再带 libc++_shared.so
  CXXSTDLIB: c++_static

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lancat-android -> target
          key: android

      - name: 依赖（bindgen 用的 libclang）
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev
          cargo install cargo-ndk --locked --version 4.1.2

      - name: 版本号
        shell: bash
        run: |
          ver=$(grep -m1 '^version' crates/lancat-android/Cargo.toml | cut -d'"' -f2)
          echo "LANCAT_VERSION=$ver-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "LANCAT_VERSION_CODE=$(( $(echo $ver | awk -F. '{print $1*10000+$2*100+$3}') * 100 + GITHUB_RUN_NUMBER % 100 ))" >> "$GITHUB_ENV"

      - name: 编译原生库（arm64-v8a、x86_64）
        working-directory: crates/lancat-android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: cargo ndk -t arm64-v8a -t x86_64 --platform 26 -o ../../android/app/src/main/jniLibs build --release --locked

      - name: 打包 APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Lancat-${LANCAT_VERSION}-android.apk"
          ls -l dist android/app/src/main/jniLibs/*

      - uses: actions/upload-artifact@v4
        with:
          name: lancat-android-apk
          path: dist/*.apk
