[package]
name = "lancat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lancat - LAN instant sharing"

[lib]
name = "lancat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lancat-core = { path = "../crates/lancat-core", default-features = false }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
anyhow = "1"
tokio = { version = "1", features = ["time", "sync", "macros", "rt", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
tokio = { version = "1", features = ["signal"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
# Native Wayland docking (wlr-layer-shell: niri, Sway, Hyprland, KDE …). Needs libgtk-layer-shell.
gtk-layer-shell = { version = "0.8", optional = true, features = ["v0_6"] }

[features]
default = []
layer-shell = ["dep:gtk-layer-shell"]

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# WebView2 COM interfaces (memory target level, environment reuse): same versions wry links
webview2-com = "0.39"
windows-core = "0.62"
windows-numerics = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# native dock strip (NSPanel + NSView); same versions tauri already links
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
